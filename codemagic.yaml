workflows:
  ios-ipa:
    name: fenqilu iOS IPA
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      # 换成你自己的苹果开发者账号里的 Bundle ID。分享扩展会匹配同名前缀。
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.shiku.coolim.pushIm.apple
      vars:
        XCODE_PROJECT: shiku_im.xcodeproj
        XCODE_SCHEME: shiku_im
    scripts:
      - name: Pull Git LFS files
        script: git lfs pull
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
