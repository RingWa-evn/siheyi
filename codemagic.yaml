workflows:
  ios-ipa:
    name: fenqilu iOS IPA
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      # 与 打包 目录里的描述文件一致。该文件只包含这一个包名和一台设备。
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: app.maroon1006.garlic5667
      vars:
        XCODE_PROJECT: shiku_im.xcodeproj
        XCODE_SCHEME: shiku_im
    scripts:
      - name: Pull Git LFS files
        script: git lfs pull
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
